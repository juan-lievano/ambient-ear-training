[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cordelia"
version = "0.1.0"
description = "Ear training that writes down every answer"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cordelia = "cordelia.cli:main"

[tool.setuptools]
packages = ["cordelia", "cordelia.modes"]
